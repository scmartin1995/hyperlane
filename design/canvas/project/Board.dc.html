<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyperlane · Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f0edeb}
a{color:#306376}a:hover{color:#244c5b}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #f0edeb; font-family: Inter, system-ui, sans-serif; color: #282828; font-size: 14px; line-height: 1.5">

  <nav aria-label="Main" style="flex: 0 0 232px; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; background: #f7f2f0; border-right: 1px solid #e6dfd9">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #6b3a8e; color: #f7f2f0; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800">H</span>
      <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 16px">Hyperlane</span>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #4e4946; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Board.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; background: #6b3a8e; color: #f7f2f0; text-decoration: none; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v12"/></svg>Board</a>
    <a href="Backlog.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #4e4946; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/></svg>Backlog</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #4e4946; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Sprints</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #4e4946; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18M8 17V9M13 17V5M18 17v-6"/></svg>Insights</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #4e4946; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>My tasks</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #4e4946; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/></svg>Team</a>
    <div style="flex-grow: 1"></div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 12px; border: 0; background: #306376; color: #f7f2f0; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Assistant</button>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: {{pagePad}}; display: flex; flex-direction: column; gap: {{sectionGap}}">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; line-height: 1.15">Board</h1>
        <p style="margin: 0; color: #4e4946">Sprint 4 · GA readiness: observe production, onboard new customers.</p>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #cfc6be; background: #ffffff; color: #282828; font: inherit; font-weight: 600; cursor: pointer">Ask the assistant</button>
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: #6b3a8e; color: #f7f2f0; font: inherit; font-weight: 600; cursor: pointer">New item</button>
      </div>
    </header>

    <div role="toolbar" aria-label="Filters" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <label for="flt" style="position: absolute; left: -9999px">Filter cards</label>
      <input id="flt" placeholder="Filter cards…" style="height: 36px; width: 220px; padding: 0 12px; border-radius: 10px; border: 1px solid #e6dfd9; background: #ffffff; font: inherit">
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #e6dfd9; background: #ffffff; font: inherit; color: #282828">All types</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #e6dfd9; background: #ffffff; font: inherit; color: #282828">All labels</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #e6dfd9; background: #ffffff; font: inherit; color: #282828">My items</button>
      <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #ece2f3; font: inherit; font-weight: 600; color: #4f2a6b">Active sprint only</button>
    </div>

    <div style="overflow-x: auto; padding-bottom: 8px">
      <div style="display: flex; gap: {{colGap}}; align-items: flex-start; min-width: max-content">
        <sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
          <section style="width: 288px; display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 16px; background: #ebe6e2">
            <header style="display: flex; align-items: center; gap: 8px; padding: 2px 4px">
              <span style="width: 10px; height: 10px; border-radius: 999px; background: {{col.color}}"></span>
              <h2 style="margin: 0; font-size: 14px; font-weight: 700">{{col.name}}</h2>
              <span style="font-size: 12px; color: #7d7873; font-variant-numeric: tabular-nums">{{col.count}}</span>
              <span style="flex: 1"></span>
              <span style="font-size: 12px; color: #7d7873">{{col.points}}</span>
            </header>
            <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
              <article style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: {{cardPad}}; padding-left: 18px; border-radius: 12px; background: #ffffff; box-shadow: 0 1px 2px rgba(40,40,40,0.06); overflow: hidden">
                <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: {{c.typeColor}}"></span>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #7d7873"><span style="font-variant-numeric: tabular-nums">{{c.key}}</span><span>·</span><span>{{c.type}}</span></div>
                <div style="font-weight: 600; line-height: 1.35">{{c.title}}</div>
                <div style="display: flex; align-items: center; gap: 6px">
                  <span style="font-size: 12px; font-weight: 600; color: #4f2a6b; background: #ece2f3; border-radius: 999px; padding: 1px 8px">{{c.label}}</span>
                  <span style="flex: 1"></span>
                  <span style="font-size: 12px; color: #4e4946; background: #ebe6e2; border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums">{{c.pts}}</span>
                  <span style="width: 24px; height: 24px; border-radius: 999px; background: {{c.avatarColor}}; color: #f7f2f0; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.who}}</span>
                </div>
              </article>
            </sc-for>
            <button type="button" style="height: 36px; border-radius: 10px; border: 1px dashed #cfc6be; background: transparent; color: #7d7873; font: inherit; text-align: left; padding: 0 12px; cursor: pointer">+ Add card</button>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"density":{"editor":"enum","options":["comfortable","compact"],"default":"comfortable","section":"Spacing"},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const compact = (this.props.density ?? 'comfortable') === 'compact';
    const story = '#27cfc3', task = '#e4b963';
    return {
      pagePad: compact ? '24px' : '32px 40px',
      sectionGap: compact ? '16px' : '24px',
      colGap: compact ? '12px' : '16px',
      cardPad: compact ? '10px 12px' : '14px 16px',
      columns: [
        { name: 'Ready', color: '#c99a3f', count: 2, points: '4 pts', cards: [
          { key: 'AP-38', type: 'Task', title: 'Alerting rules for the API', label: 'ga-blocker', pts: 2, who: 'PO', avatarColor: '#bc553c', typeColor: task },
          { key: 'AP-41', type: 'Story', title: 'Contextual tooltips on first visit', label: 'ga-blocker', pts: 2, who: 'KT', avatarColor: '#306376', typeColor: story }
        ] },
        { name: 'In progress', color: '#306376', count: 3, points: '13 pts', cards: [
          { key: 'AP-32', type: 'Story', title: 'Suggested articles while writing a ticket', label: 'support', pts: 3, who: 'KT', avatarColor: '#306376', typeColor: story },
          { key: 'AP-37', type: 'Story', title: 'Performance dashboard', label: 'ga-blocker', pts: 5, who: 'PO', avatarColor: '#bc553c', typeColor: story },
          { key: 'AP-40', type: 'Story', title: 'Guided setup checklist', label: 'ga-blocker', pts: 5, who: 'KT', avatarColor: '#306376', typeColor: story }
        ] },
        { name: 'In review', color: '#6b3a8e', count: 1, points: '2 pts', cards: [
          { key: 'AP-33', type: 'Task', title: 'Help center icon set', label: 'support', pts: 2, who: 'ZC', avatarColor: '#6b3a8e', typeColor: task }
        ] },
        { name: 'Done', color: '#5f9a68', count: 2, points: '6 pts', cards: [
          { key: 'AP-30', type: 'Story', title: 'Error reporting pipeline', label: 'ga-blocker', pts: 3, who: 'PO', avatarColor: '#bc553c', typeColor: story },
          { key: 'AP-31', type: 'Story', title: 'Suggested help articles', label: 'support', pts: 3, who: 'KT', avatarColor: '#306376', typeColor: story }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
